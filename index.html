<html>
  <head>
    <!-- https://trunk-rs.github.io/trunk/guide/assets/index.html -->

    <!-- https://developer.chrome.com/blog/web-audio-autoplay/#moving-forward -->
    <!-- https://github.com/NiklasEi/bevy_game_template/blob/1f3e70f3446ba315d41185dfd67c5e4ac0559d18/index.html#L14 -->
    <!-- Ensures audio runs in bevy app (needed due to autoplay rules in browsers) -->
    <link data-trunk rel="inline" href="sound.js"/>
    <link data-trunk rel="copy-dir" href="./assets/" />
    <link data-trunk rel="css" href="index.css" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
  </head>
  <style>
    /* maybe remove when embedding in canvas that is NOT fullscreen on browser? */
    canvas {
      outline: none;
    }
    body {
      margin: 1px;
      background-color: 2b2c2f;
    }
  </style>
  <body>
    <div class="loading_screen" id="loading_screen">
      <!-- loading_screen div removed by bevy on startup -->
      <div class="loader"></div>
      <p class="loader_text">Loading...</p>
      <p class="loader_text javascript_disabled" style="display: none">JavaScript disabled: app will not start!</p>
    </div>
    <input
      type="file"
      id="audio_picker"
      accept=".ogg,.flac,.wav,.mp3,.aac"
      style="display: none"
    />
    <noscript>
      <style>
      .loader_text{
        display: none !important;
      }
      .javascript_disabled{
        display: block !important;
        color: #Ff0000;
        text-wrap: nowrap;
      }
      </style>
    </noscript>
  </body>
</html>
